<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📧 Test EmailJS - Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 76px;
            padding-bottom: 30px;
        }

        /* ===== HEADER ===== */
        .test-header {
            background: #0F8B5D;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(15, 139, 93, 0.2);
        }

        .test-header .back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .test-header .test-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .test-header .test-title i {
            margin-right: 8px;
        }

        .test-header .badge-api {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ===== MAIN ===== */
        .test-main {
            flex: 1;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .test-card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px 32px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(15, 139, 93, 0.06);
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .test-card .test-icon {
            font-size: 56px;
            margin-bottom: 8px;
        }

        .test-card .test-icon i {
            background: linear-gradient(135deg, #0F8B5D, #0A6B47);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .test-card h2 {
            font-size: 24px;
            font-weight: 800;
            color: #0F8B5D;
            margin-bottom: 4px;
        }

        .test-card .subtitle {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .test-divider {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #0F8B5D, #4ade80);
            border-radius: 10px;
            margin: 4px auto 16px auto;
        }

        /* ===== FORMULAIRE ===== */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .form-group label i {
            color: #0F8B5D;
            margin-right: 6px;
            width: 18px;
        }

        .form-group .input-wrapper {
            display: flex;
            align-items: center;
            background: #f8f9fc;
            border: 2px solid #e6e8ef;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #0F8B5D;
            box-shadow: 0 0 0 4px rgba(15, 139, 93, 0.08);
            background: white;
        }

        .form-group .input-wrapper input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            background: transparent;
            outline: none;
            color: #1a1a2e;
            font-weight: 500;
        }

        .form-group .input-wrapper input::placeholder {
            color: #b0b5c4;
            font-weight: 400;
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 16px 0 4px;
            color: #b0b5c4;
            font-size: 18px;
            transition: color 0.3s;
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: #0F8B5D;
        }

        /* ===== BOUTON ===== */
        .btn-send {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0F8B5D, #0A6B47);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-send:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(15, 139, 93, 0.25);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-send .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== STATUS ===== */
        .status-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #e6f7ee;
            color: #0e7a49;
            border: 1px solid #bfebd3;
        }

        .status-message.error {
            display: block;
            background: #fcebea;
            color: #c0342a;
            border: 1px solid #f3c6c2;
        }

        .status-message.info {
            display: block;
            background: #eaf1ff;
            color: #2563eb;
            border: 1px solid #c7d9fb;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding-top: 68px; }
            .test-header { padding: 10px 14px; }
            .test-header .test-title { font-size: 16px; }
            .test-header .back-btn { width: 36px; height: 36px; font-size: 16px; }
            .test-header .badge-api { font-size: 10px; padding: 3px 10px; }
            .test-main { padding: 12px 14px; }
            .test-card { padding: 28px 20px 24px 20px; border-radius: 20px; }
            .test-card h2 { font-size: 20px; }
            .test-card .test-icon { font-size: 44px; }
            .form-group .input-wrapper input { font-size: 15px; padding: 12px 14px; }
            .btn-send { font-size: 16px; padding: 14px; }
        }

        @media (max-width: 400px) {
            .test-header { padding: 8px 10px; }
            .test-header .test-title { font-size: 14px; }
            .test-header .back-btn { width: 32px; height: 32px; font-size: 14px; }
            .test-card { padding: 20px 14px 18px 14px; border-radius: 16px; }
            .test-card h2 { font-size: 17px; }
            .test-card .test-icon { font-size: 36px; }
            .form-group .input-wrapper input { font-size: 14px; padding: 10px 12px; }
            .btn-send { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="test-header">
        <button class="back-btn" onclick="window.location.href='/virtmak.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="test-title"><i class="fas fa-envelope"></i> Test EmailJS</span>
        <span class="badge-api"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;"></i> BETA</span>
    </header>

    <!-- ===== CONTENU ===== -->
    <main class="test-main">
        <div class="test-card">
            <div class="test-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <h2>📧 Envoi d'email</h2>
            <p class="subtitle">
                Testez l'envoi d'email via EmailJS
            </p>

            <div class="test-divider"></div>

            <form id="emailTestForm">
                <!-- Email du destinataire -->
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Destinataire</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="recipientEmail" placeholder="email@exemple.com" required />
                    </div>
                </div>

                <!-- Nom du destinataire -->
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nom du destinataire</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="recipientName" placeholder="Jean Dupont" required />
                    </div>
                </div>

                <!-- Montant (test) -->
                <div class="form-group">
                    <label><i class="fas fa-heart"></i> Montant (FCFA)</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-money-bill-wave"></i></span>
                        <input type="number" id="amountTest" placeholder="500" value="500" required />
                    </div>
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn-send" id="sendBtn">
                    <i class="fas fa-paper-plane"></i> Envoyer l'email
                </button>

                <div id="statusMessage" class="status-message"></div>
            </form>

            <p style="text-align:center;font-size:12px;color:#9ca3af;margin-top:16px;">
                <i class="fas fa-lock" style="color:#0F8B5D;"></i> Test sécurisé via EmailJS
            </p>
        </div>
    </main>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ testmail.html chargé');

            // ===== RÉFÉRENCES =====
            const form = document.getElementById('emailTestForm');
            const recipientEmail = document.getElementById('recipientEmail');
            const recipientName = document.getElementById('recipientName');
            const amountTest = document.getElementById('amountTest');
            const sendBtn = document.getElementById('sendBtn');
            const statusMessage = document.getElementById('statusMessage');

            // ===== VARIABLES EMAILJS =====
            const EMAILJS_SERVICE_ID = 'service_2hkqcdm';
            const EMAILJS_TEMPLATE_ID = 'template_ndwcdwn';
            const EMAILJS_PUBLIC_KEY = '4TkvKRRbn9qDSIjG3';

            // ===== AFFICHER UN MESSAGE =====
            function showStatus(message, type = 'info') {
                statusMessage.className = 'status-message ' + type;
                statusMessage.textContent = message;
            }

            function hideStatus() {
                statusMessage.className = 'status-message';
            }

            // ===== ENVOYER L'EMAIL =====
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideStatus();

                const email = recipientEmail.value.trim();
                const name = recipientName.value.trim();
                const amount = parseInt(amountTest.value) || 500;

                if (!email) {
                    showStatus('⚠️ Veuillez entrer un email valide.', 'error');
                    recipientEmail.focus();
                    return;
                }

                if (!name) {
                    showStatus('⚠️ Veuillez entrer un nom.', 'error');
                    recipientName.focus();
                    return;
                }

                // Désactiver le bouton
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<span class="spinner"></span> Envoi en cours...';

                console.log('📧 Envoi de l\'email...');
                console.log('   Destinataire:', email);
                console.log('   Nom:', name);
                console.log('   Montant:', amount);

                try {
                    const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            service_id: EMAILJS_SERVICE_ID,
                            template_id: EMAILJS_TEMPLATE_ID,
                            user_id: EMAILJS_PUBLIC_KEY,
                            template_params: {
                                name: name,
                                email: email,
                                orders: 'Test EmailJS - Virtual Market',
                                order_id: 'TEST-' + Date.now(),
                                price: amount,
                                cost: amount,
                                units: 1
                            }
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        console.log('✅ Email envoyé avec succès !');
                        showStatus('✅ Email envoyé avec succès à ' + email + ' !', 'success');
                        // Réinitialiser le formulaire (optionnel)
                        // recipientEmail.value = '';
                        // recipientName.value = '';
                    } else {
                        console.error('❌ Erreur EmailJS:', data);
                        showStatus('❌ Erreur lors de l\'envoi : ' + (data.message || data.error || 'Erreur inconnue'), 'error');
                    }
                } catch (error) {
                    console.error('❌ Erreur réseau:', error);
                    showStatus('❌ Erreur de connexion à EmailJS.', 'error');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer l\'email';
                }
            });

            console.log('✅ testmail.html initialisé');

        });
    </script>

</body>
</html>
