<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💳 Paiement - Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* ============================================================ */
        /* HEADER - 60px, arrondi 50px - WAVE NAVY                      */
        /* ============================================================ */
        .pay-header {
            background: #0F1B4D;
            height: 60px;
            border-radius: 50px;
            margin: 12px 16px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(15, 27, 77, 0.25);
            flex-shrink: 0;
            position: relative;
        }

        .pay-header .header-text {
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .pay-header .header-text span {
            font-weight: 300;
            opacity: 0.5;
        }

        /* ============================================================ */
        /* MAIN                                                         */
        /* ============================================================ */
        .pay-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 30px 16px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ============================================================ */
        /* CARTE BLANCHE                                                */
        /* ============================================================ */
        .pay-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px 28px 24px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(15, 27, 77, 0.06);
            animation: fadeInUp 0.5s ease;
            text-align: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================ */
        /* LOGO WAVE - BORDURES ARRONDIES UNIQUEMENT                    */
        /* ============================================================ */
        .wave-logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .wave-logo {
            width: 100px;
            height: 100px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(15, 27, 77, 0.12);
            background: transparent;
        }

        .wave-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ============================================================ */
        /* TITRE                                                         */
        /* ============================================================ */
        .pay-title {
            font-size: 22px;
            font-weight: 700;
            color: #0F1B4D;
            margin-bottom: 4px;
        }

        .pay-subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ============================================================ */
        /* RÉCAPITULATIF                                                */
        /* ============================================================ */
        .recap-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
            font-size: 15px;
        }

        .recap-item:last-child {
            border-bottom: none;
        }

        .recap-item .label {
            color: #6b7280;
        }

        .recap-item .value {
            font-weight: 600;
            color: #1a1a2e;
        }

        .recap-item .value.amount {
            color: #0F1B4D;
            font-size: 20px;
            font-weight: 800;
        }

        /* ============================================================ */
        /* CHAMP MONTANT LIBRE - TOUJOURS ACTIF                         */
        /* ============================================================ */
        .amount-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 8px 0;
        }

        .amount-input-wrapper .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f8f9fc;
            border: 2px solid #e6e8ef;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .amount-input-wrapper .input-wrapper:focus-within {
            border-color: #0F1B4D;
            box-shadow: 0 0 0 4px rgba(15, 27, 77, 0.08);
            background: white;
        }

        .amount-input-wrapper .input-wrapper .prefix {
            padding: 0 0 0 16px;
            font-weight: 600;
            color: #6b7280;
            font-size: 14px;
        }

        .amount-input-wrapper .input-wrapper input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            background: transparent;
            outline: none;
            color: #1a1a2e;
            font-weight: 500;
            min-width: 0;
        }

        .amount-input-wrapper .input-wrapper input::placeholder {
            color: #b0b5c4;
            font-weight: 400;
        }

        .amount-input-wrapper .input-wrapper .input-icon {
            padding: 0 16px 0 4px;
            color: #b0b5c4;
            font-size: 18px;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .amount-input-wrapper .input-wrapper:focus-within .input-icon {
            color: #0F1B4D;
        }

        .amount-hint {
            font-size: 12px;
            color: #9ca3af;
            text-align: left;
            padding-left: 4px;
        }

        /* ============================================================ */
        /* BOUTON PAYER AVEC WAVE - WAVE NAVY                           */
        /* ============================================================ */
        .btn-pay-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-pay {
            background: #0F1B4D;
            color: white;
            border: none;
            padding: 18px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(15, 27, 77, 0.25);
        }

        .btn-pay:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(15, 27, 77, 0.35);
        }

        .btn-pay:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-pay .btn-wave-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            flex-shrink: 0;
        }

        .btn-pay .btn-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-pay .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================ */
        /* MESSAGE INFO                                                 */
        /* ============================================================ */
        .info-message {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            background: #eaf1ff;
            color: #2563eb;
            border: 1px solid #c7d9fb;
            display: none;
        }

        .info-message.show {
            display: block;
        }

        .info-message.warning {
            background: #fff3df;
            color: #b45309;
            border-color: #f5dbaa;
        }

        /* ============================================================ */
        /* FOOTER SECURITE                                              */
        /* ============================================================ */
        .pay-footer-security {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 16px;
            opacity: 0.7;
        }

        .pay-footer-security i {
            color: #0F1B4D;
            margin-right: 4px;
        }

        /* ============================================================ */
        /* TOAST                                                         */
        /* ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: #0F1B4D;
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(15, 27, 77, 0.2);
            display: none;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast-container.error {
            background: #dc3545;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================ */
        /* RESPONSIVE                                                    */
        /* ============================================================ */
        @media (max-width: 600px) {
            .pay-header { height: 54px; border-radius: 40px; margin: 10px 12px 0 12px; }
            .pay-header .header-text { font-size: 12px; }
            .pay-main { padding: 16px 12px 20px 12px; }
            .pay-card { padding: 24px 18px 20px 18px; border-radius: 20px; }
            .pay-title { font-size: 19px; }
            .wave-logo { width: 80px; height: 80px; border-radius: 24px; }
            .recap-item { font-size: 14px; padding: 8px 0; }
            .recap-item .value.amount { font-size: 18px; }
            .btn-pay { padding: 16px 32px; font-size: 16px; max-width: 300px; }
            .btn-pay .btn-wave-icon { width: 24px; height: 24px; }
            .btn-pay .btn-text { font-size: 16px; }
            .amount-input-wrapper .input-wrapper input { font-size: 15px; padding: 12px 14px; }
        }

        @media (max-width: 420px) {
            .pay-header { height: 48px; border-radius: 32px; margin: 8px 8px 0 8px; }
            .pay-header .header-text { font-size: 10px; }
            .pay-main { padding: 12px 8px 16px 8px; }
            .pay-card { padding: 18px 14px 14px 14px; border-radius: 18px; }
            .pay-title { font-size: 17px; }
            .pay-subtitle { font-size: 13px; }
            .wave-logo { width: 70px; height: 70px; border-radius: 20px; }
            .recap-item { font-size: 13px; padding: 6px 0; }
            .recap-item .value.amount { font-size: 16px; }
            .btn-pay { padding: 14px 24px; font-size: 14px; max-width: 260px; border-radius: 40px; gap: 10px; }
            .btn-pay .btn-wave-icon { width: 20px; height: 20px; }
            .btn-pay .btn-text { font-size: 14px; }
            .amount-input-wrapper .input-wrapper input { font-size: 14px; padding: 10px 12px; }
            .toast-container { font-size: 13px; padding: 10px 16px; bottom: 16px; }
        }

        @media (max-width: 350px) {
            .pay-card { padding: 14px 10px 12px 10px; border-radius: 16px; }
            .wave-logo { width: 60px; height: 60px; border-radius: 16px; }
            .btn-pay { padding: 12px 20px; font-size: 13px; max-width: 220px; }
            .btn-pay .btn-wave-icon { width: 18px; height: 18px; }
            .btn-pay .btn-text { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER - WAVE NAVY                                            -->
    <!-- ============================================================ -->
    <header class="pay-header">
        <span class="header-text">⚡ powered by <span>megane</span></span>
    </header>

    <!-- ============================================================ -->
    <!-- CONTENU PRINCIPAL                                             -->
    <!-- ============================================================ -->
    <main class="pay-main">

        <div class="pay-card">

            <!-- Logo Wave arrondi -->
            <div class="wave-logo-wrapper">
                <div class="wave-logo">
                    <img src="/wave.png" alt="Wave" />
                </div>
            </div>

            <!-- Titre -->
            <div class="pay-title">Paiement sécurisé</div>
            <div class="pay-subtitle">Confirmez votre paiement via Wave</div>

            <!-- Récapitulatif -->
            <div class="recap-item">
                <span class="label">👤 Donateur</span>
                <span class="value" id="displayName">-</span>
            </div>
            <div class="recap-item">
                <span class="label">📧 Email</span>
                <span class="value" id="displayEmail">-</span>
            </div>
            <div class="recap-item">
                <span class="label">🔗 Référence</span>
                <span class="value" id="displayReference" style="font-size:12px;color:#6b7280;">-</span>
            </div>

            <!-- Montant libre - CHAMP TOUJOURS ACTIF -->
            <div class="amount-input-wrapper">
                <div class="input-wrapper">
                    <span class="prefix">FCFA</span>
                    <input type="number" id="amountInput" placeholder="Montant de votre choix (min. 1 FCFA)" min="1" required />
                    <span class="input-icon"><i class="fas fa-arrow-right"></i></span>
                </div>
            </div>
            <div class="amount-hint">💡 Entrez le montant de votre choix (1 FCFA minimum)</div>

            <!-- Bouton Payer avec Wave -->
            <div class="btn-pay-wrapper">
                <button class="btn-pay" id="payBtn">
                    <img src="/wave.png" alt="Wave" class="btn-wave-icon" />
                    <span class="btn-text">Payer avec Wave</span>
                </button>
            </div>

            <div id="infoMessage" class="info-message"></div>

            <!-- Sécurité -->
            <div class="pay-footer-security">
                <i class="fas fa-lock"></i> Paiement sécurisé via Jèko
            </div>

        </div>

    </main>

    <!-- ============================================================ -->
    <!-- TOAST                                                         -->
    <!-- ============================================================ -->
    <div class="toast-container" id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ pay.html (montant libre) chargé');

            // ===== RÉFÉRENCES =====
            const displayName = document.getElementById('displayName');
            const displayEmail = document.getElementById('displayEmail');
            const displayReference = document.getElementById('displayReference');
            const amountInput = document.getElementById('amountInput');
            const payBtn = document.getElementById('payBtn');
            const toast = document.getElementById('toast');
            const infoMessage = document.getElementById('infoMessage');

            // ===== RÉCUPÉRER LES PARAMÈTRES URL =====
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || 'Donateur anonyme';
            const email = urlParams.get('email') || 'email@non-renseigne.com';
            const initialAmount = parseInt(urlParams.get('amount')) || 1;
            const reference = urlParams.get('reference') || null;

            // ===== AFFICHER LES INFOS =====
            displayName.textContent = name;
            displayEmail.textContent = email;
            displayReference.textContent = reference || 'Non disponible';
            amountInput.value = initialAmount;

            console.log('📋 RÉCAPITULATIF:');
            console.log(`   👤 Nom: ${name}`);
            console.log(`   📧 Email: ${email}`);
            console.log(`   💰 Montant: ${initialAmount} FCFA`);
            console.log(`   🔗 Référence: ${reference || 'NON FOURNIE'}`);

            // ===== TOAST =====
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.className = 'toast-container' + (type === 'error' ? ' error' : '');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 4000);
            }

            // ===== MESSAGE INFO =====
            function showInfo(message, type = 'info') {
                infoMessage.textContent = message;
                infoMessage.className = 'info-message show' + (type === 'warning' ? ' warning' : '');
                setTimeout(() => {
                    infoMessage.className = 'info-message';
                }, 4000);
            }

            // ===== VALIDATION DU MONTANT =====
            function validateAmount() {
                const amount = parseInt(amountInput.value);
                return !isNaN(amount) && amount >= 1;
            }

            // ===== METTRE À JOUR LE STATUT VERS PARTICIPANT =====
            async function updateUserStatus(status) {
                try {
                    const res = await fetch('/api/user/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, status })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        console.log(`✅ Statut mis à jour : ${status}`);
                    } else {
                        console.warn('⚠️ Erreur mise à jour statut:', data);
                    }
                } catch (error) {
                    console.warn('⚠️ Erreur mise à jour statut:', error);
                }
            }

            // ===== PAYER =====
            payBtn.addEventListener('click', async function() {
                const amount = parseInt(amountInput.value);

                if (isNaN(amount) || amount < 1) {
                    showInfo('⚠️ Veuillez entrer un montant valide (minimum 1 FCFA).', 'warning');
                    amountInput.focus();
                    return;
                }

                // ✅ Vérifier que la référence est présente
                if (!reference) {
                    showInfo('⚠️ Référence de commande manquante. Retour à l\'accueil.', 'warning');
                    setTimeout(() => {
                        window.location.href = '/virtmak.html';
                    }, 2000);
                    return;
                }

                // ✅ Désactiver le bouton
                payBtn.disabled = true;
                payBtn.innerHTML = '<span class="spinner"></span>';

                try {
                    // ✅ Mettre à jour le statut vers "participant"
                    await updateUserStatus('participant');

                    // ✅ Créer le lien de paiement Jèko (avec la référence)
                    const response = await fetch('/create-payment-link', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            name, 
                            email, 
                            amount,
                            reference: reference
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Erreur création paiement');
                    }

                    if (!data.checkout_url) {
                        throw new Error('Aucune URL de paiement reçue');
                    }

                    console.log('🔗 Lien généré :', data.checkout_url);

                    // ✅ Redirection vers Jèko
                    showInfo('🔄 Redirection vers Jèko...', 'info');
                    setTimeout(() => {
                        window.location.href = data.checkout_url;
                    }, 800);

                } catch (error) {
                    console.error('❌ Erreur:', error);
                    showInfo('❌ ' + error.message, 'warning');
                    payBtn.disabled = false;
                    payBtn.innerHTML = `
                        <img src="/wave.png" alt="Wave" class="btn-wave-icon" />
                        <span class="btn-text">Payer avec Wave</span>
                    `;
                }
            });

            console.log('✅ pay.html initialisé');

        });
    </script>

</body>
</html>
