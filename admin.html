<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Admin - Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <header class="admin-header">
        <div class="logo">
            <img src="/logo.png" alt="VirtMak" class="logo-img" />
            Virtual <span>Market</span>
        </div>

        <div class="header-filters">
            <button class="filter-btn active" data-filter="all">
                Tous <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-btn" data-filter="visiteur">
                Visiteurs <span class="badge-count" id="countVisiteur">0</span>
            </button>
            <button class="filter-btn" data-filter="participant">
                Participants <span class="badge-count" id="countParticipant">0</span>
            </button>
            <button class="filter-btn" data-filter="donateur">
                Donateurs <span class="badge-count" id="countDonateur">0</span>
            </button>
        </div>

        <div class="header-right">
            <div class="header-stats">
                <span class="stat-item">
                    Total <span class="stat-value" id="statTotal">0 FCFA</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn-refresh" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> <span>Rafraîchir</span>
                </button>
                <a href="/virtmak.html" class="btn-virtmak">
                    <i class="fas fa-home"></i> <span>VirtMak</span>
                </a>
                <a href="/reset-data.html" class="btn-reset">
                    <i class="fas fa-trash-alt"></i> <span>Reset DB</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- LAYOUT - 3 CADRES HORIZONTAUX                                 -->
    <!-- ============================================================ -->
    <div class="admin-layout">

        <!-- ===== CADRE 1 : SIDEBAR ===== -->
        <aside class="cadre-sidebar" id="cadreSidebar">
            <div class="cadre-header">
                <span class="title"><i class="fas fa-users"></i> Utilisateurs</span>
                <span class="count" id="sidebarCount">0</span>
            </div>
            <div class="cadre-body" id="usersList">
                <div class="empty-users" id="emptyUsers">
                    <i class="fas fa-inbox"></i>
                    <p>Aucun utilisateur</p>
                </div>
            </div>
        </aside>

        <!-- ===== CADRE 2 : DÉTAILS UTILISATEUR ===== -->
        <section class="cadre-details" id="cadreDetails">
            <div class="cadre-header">
                <span class="title"><i class="fas fa-user-circle"></i> Détails</span>
                <!-- ✅ Handle de redimensionnement -->
                <div class="resize-handle" id="resizeHandle2">
                    <i class="fas fa-grip-vertical"></i>
                </div>
            </div>
            <div class="cadre-body" id="detailsBody">
                <div class="empty-detail" id="emptyDetail">
                    <i class="fas fa-hand-holding-heart"></i>
                    <h3>Aucun utilisateur sélectionné</h3>
                    <p>Cliquez sur un utilisateur dans la liste de gauche</p>
                </div>
                <div id="detailContent" style="display:none;">
                    <!-- Rempli par JS -->
                </div>
            </div>
        </section>

        <!-- ===== CADRE 3 : LISTE DES PAIEMENTS ===== -->
        <section class="cadre-payments" id="cadrePayments">
            <div class="cadre-header">
                <span class="title"><i class="fas fa-credit-card"></i> Paiements</span>
                <span class="count" id="paymentsCount">0</span>
                <!-- ✅ Handle de redimensionnement -->
                <div class="resize-handle" id="resizeHandle3">
                    <i class="fas fa-grip-vertical"></i>
                </div>
            </div>
            <div class="cadre-body" id="paymentsList">
                <div class="empty-payments" id="emptyPayments">
                    <i class="fas fa-credit-card"></i>
                    <p>Aucun paiement</p>
                </div>
                <div id="paymentsContent" style="display:none;">
                    <!-- Rempli par JS -->
                </div>
            </div>
        </section>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================ -->
    <script src="admin.js"></script>

</body>
</html>
