<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Admin - Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <header class="admin-header">
        <div class="logo">
            <img src="/logo.png" alt="VirtMak" class="logo-img" />
            Virtual <span>Market</span>
        </div>

        <div class="header-filters">
            <button class="filter-btn active" data-filter="all">
                📋 Tous <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-btn" data-filter="visiteur">
                🟡 Visiteurs <span class="badge-count" id="countVisiteur">0</span>
            </button>
            <button class="filter-btn" data-filter="participant">
                🔵 Participants <span class="badge-count" id="countParticipant">0</span>
            </button>
            <button class="filter-btn" data-filter="donateur">
                🟢 Donateurs <span class="badge-count" id="countDonateur">0</span>
            </button>
            <button class="filter-btn" data-filter="gold">
                🟣 Gold <span class="badge-count" id="countGold">0</span>
            </button>
            <button class="filter-btn" data-filter="premium">
                🟠 Premium <span class="badge-count" id="countPremium">0</span>
            </button>
        </div>

        <div class="header-right">
            <div class="header-stats">
                <span class="stat-item" id="statTotalItem">
                    💰 Total <span class="stat-value" id="statTotal">0 FCFA</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn-refresh" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> <span>Rafraîchir</span>
                </button>
                <a href="/pay.html" class="btn-paybeta">
                    🔵 PayBETA
                </a>
            </div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- LAYOUT                                                        -->
    <!-- ============================================================ -->
    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title"><i class="fas fa-users"></i> Utilisateurs</span>
                <span class="sidebar-count" id="sidebarCount">0</span>
            </div>
            <div class="users-list" id="usersList">
                <div class="empty-users" id="emptyUsers">
                    <i class="fas fa-inbox"></i>
                    <p>Aucun utilisateur</p>
                </div>
            </div>
        </aside>

        <!-- CONTENU -->
        <main class="admin-content" id="adminContent">
            <div class="empty-detail" id="emptyDetail">
                <i class="fas fa-hand-holding-heart"></i>
                <h3>Aucun utilisateur sélectionné</h3>
                <p>Cliquez sur un utilisateur dans la liste de gauche</p>
            </div>
            <div class="detail-scroll" id="detailContainer" style="display:none;">
                <!-- Rempli par JS -->
            </div>
        </main>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================ -->
    <script src="admin.js"></script>

</body>
</html>
