<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Admin - Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================================ */
        /* HEADER (VERT ARRONDI)                                         */
        /* ============================================================ */
        .admin-header {
            background: #0F8B5D;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(15, 139, 93, 0.2);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .admin-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .admin-header .logo i {
            font-size: 22px;
        }

        .admin-header .logo span {
            font-weight: 300;
            opacity: 0.7;
        }

        .admin-header .header-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .admin-header .header-stats .stat-item {
            color: white;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-header .header-stats .stat-item .stat-value {
            font-family: 'Courier New', monospace;
            font-weight: 700;
        }

        .admin-header .header-stats .stat-item.visiteur .stat-value { color: #a78bfa; }
        .admin-header .header-stats .stat-item.participant .stat-value { color: #fbbf24; }
        .admin-header .header-stats .stat-item.donateur .stat-value { color: #34d399; }

        .admin-header .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-header .header-actions .btn-refresh {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-header .header-actions .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .admin-header .header-actions .btn-home {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-header .header-actions .btn-home:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ============================================================ */
        /* FILTRES (HEADER)                                              */
        /* ============================================================ */
        .filter-bar {
            background: white;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: fixed;
            top: 68px;
            left: 0;
            right: 0;
            z-index: 90;
            border-bottom: 1px solid #e6e8ef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .filter-bar .filter-btn {
            padding: 6px 16px;
            border: 2px solid #e6e8ef;
            border-radius: 30px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .filter-btn:hover {
            border-color: #0F8B5D;
            color: #0F8B5D;
        }

        .filter-bar .filter-btn.active {
            background: #0F8B5D;
            color: white;
            border-color: #0F8B5D;
        }

        .filter-bar .filter-btn .badge-count {
            background: rgba(0,0,0,0.08);
            padding: 0 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .filter-bar .filter-btn.active .badge-count {
            background: rgba(255,255,255,0.2);
        }

        /* ============================================================ */
        /* LAYOUT PRINCIPAL                                             */
        /* ============================================================ */
        .admin-layout {
            display: flex;
            height: calc(100vh - 150px);
            margin-top: 150px;
            gap: 0;
        }

        /* ============================================================ */
        /* SIDEBAR (HAUTEUR FIXE, CONTENU SCROLLABLE)                   */
        /* ============================================================ */
        .admin-sidebar {
            width: 300px;
            min-width: 280px;
            background: white;
            border-right: 1px solid #e6e8ef;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .admin-sidebar .sidebar-header {
            padding: 14px 20px 10px 20px;
            border-bottom: 1px solid #f0f0f5;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-sidebar .sidebar-header .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-sidebar .sidebar-header .sidebar-count {
            font-size: 12px;
            font-weight: 600;
            color: #0F8B5D;
            background: #e6f7ee;
            padding: 2px 12px;
            border-radius: 20px;
        }

        /* ===== LISTE DES UTILISATEURS (SCROLLABLE) ===== */
        .admin-sidebar .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 16px 12px;
        }

        .admin-sidebar .users-list::-webkit-scrollbar {
            width: 4px;
        }

        .admin-sidebar .users-list::-webkit-scrollbar-thumb {
            background: #d8dbe4;
            border-radius: 10px;
        }

        /* ===== CADRE UTILISATEUR ===== */
        .user-item {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 6px;
            border: 1.5px solid #f0f2f5;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-item:hover {
            border-color: #0F8B5D;
            background: #f0faf5;
            transform: translateX(4px);
        }

        .user-item.active {
            border-color: #0F8B5D;
            background: #e6f7ee;
            box-shadow: 0 2px 12px rgba(15, 139, 93, 0.08);
        }

        .user-item .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-item .user-name .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-item .user-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            flex-shrink: 0;
        }

        .user-item .user-status-dot.visiteur { background: #a78bfa; }
        .user-item .user-status-dot.participant { background: #fbbf24; }
        .user-item .user-status-dot.donateur { background: #34d399; }

        .user-item .user-amount {
            font-size: 13px;
            font-weight: 700;
            color: #0F8B5D;
            font-family: 'Courier New', monospace;
        }

        /* ===== EMPTY SIDEBAR ===== */
        .users-list .empty-users {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
        }

        .users-list .empty-users i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: #d8dbe4;
        }

        /* ============================================================ */
        /* CONTENU PRINCIPAL (DÉTAIL)                                   */
        /* ============================================================ */
        .admin-content {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #f5f6f9;
        }

        .admin-content::-webkit-scrollbar {
            width: 6px;
        }

        .admin-content::-webkit-scrollbar-thumb {
            background: #d8dbe4;
            border-radius: 10px;
        }

        /* ===== DÉTAIL CARD ===== */
        .detail-card {
            background: white;
            border-radius: 20px;
            padding: 28px 32px;
            border: 1px solid #e6e8ef;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-card .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f2f5;
        }

        .detail-card .detail-header .detail-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .detail-card .detail-header .detail-title i {
            color: #0F8B5D;
            margin-right: 8px;
        }

        .detail-card .detail-header .detail-id {
            font-size: 12px;
            color: #9ca3af;
            font-family: 'Courier New', monospace;
            background: #f8f9fc;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .detail-card .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fc;
            font-size: 15px;
        }

        .detail-card .detail-row:last-child {
            border-bottom: none;
        }

        .detail-card .detail-row .label {
            color: #6b7280;
            font-weight: 500;
        }

        .detail-card .detail-row .value {
            font-weight: 600;
            color: #1a1a2e;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .detail-card .detail-row .value.amount {
            color: #0F8B5D;
            font-size: 20px;
            font-weight: 800;
        }

        .detail-card .detail-row .value .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .detail-card .detail-row .value .status-badge.visiteur {
            background: #f1ebfe;
            color: #7c3aed;
        }

        .detail-card .detail-row .value .status-badge.participant {
            background: #fff3df;
            color: #b45309;
        }

        .detail-card .detail-row .value .status-badge.donateur {
            background: #e6f7ee;
            color: #0e7a49;
        }

        .detail-card .detail-row .value .tx-id {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #6b7280;
        }

        /* ===== STATUT AVEC HORAIRE (FOOTER) ===== */
        .detail-status-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid #f0f2f5;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-status-footer .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding: 4px 0;
        }

        .detail-status-footer .status-item .status-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #6b7280;
        }

        .detail-status-footer .status-item .status-label i {
            font-size: 16px;
        }

        .detail-status-footer .status-item .status-time {
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .detail-status-footer .status-item .status-time.pending {
            color: #f59e0b;
        }

        .detail-status-footer .status-item .status-time.success {
            color: #22c55e;
        }

        .detail-status-footer .status-item .status-time .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        .detail-status-footer .status-item .status-time .badge.pending {
            background: #fff3df;
            color: #b45309;
        }

        .detail-status-footer .status-item .status-time .badge.success {
            background: #e6f7ee;
            color: #0e7a49;
        }

        /* ===== EMPTY STATE ===== */
        .empty-detail {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-detail i {
            font-size: 56px;
            color: #d8dbe4;
            display: block;
            margin-bottom: 12px;
        }

        .empty-detail h3 {
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        /* ============================================================ */
        /* RESPONSIVE                                                    */
        /* ============================================================ */
        @media (max-width: 992px) {
            .admin-sidebar {
                width: 250px;
                min-width: 220px;
            }
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 10px 16px;
                height: 60px;
                border-radius: 0 0 16px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .admin-header .logo { font-size: 15px; justify-content: center; }
            .admin-header .header-stats { justify-content: center; gap: 8px; }
            .admin-header .header-stats .stat-item { font-size: 11px; padding: 3px 10px; }
            .admin-header .header-actions { justify-content: center; }
            .admin-header .header-actions .btn-refresh span,
            .admin-header .header-actions .btn-home span { display: none; }

            .filter-bar {
                top: 120px;
                padding: 6px 12px;
                gap: 4px;
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            .filter-bar .filter-btn { font-size: 11px; padding: 4px 10px; white-space: nowrap; }
            .filter-bar .filter-btn .badge-count { font-size: 9px; padding: 0 6px; }

            .admin-layout {
                flex-direction: column;
                height: calc(100vh - 180px);
                margin-top: 180px;
            }
            .admin-sidebar {
                width: 100%;
                min-width: unset;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid #e6e8ef;
                flex-shrink: 0;
            }
            .admin-content {
                flex: 1;
                padding: 16px;
                overflow-y: auto;
            }
            .detail-card {
                padding: 20px 18px;
            }
            .detail-card .detail-row {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 8px 12px;
                height: 54px;
                border-radius: 0 0 12px 12px;
            }
            .admin-header .logo { font-size: 13px; }
            .admin-header .header-stats .stat-item { font-size: 10px; padding: 2px 8px; }
            .admin-header .header-stats .stat-item .stat-value { font-size: 11px; }

            .filter-bar {
                top: 112px;
                padding: 4px 8px;
                gap: 4px;
            }
            .filter-bar .filter-btn { font-size: 10px; padding: 3px 8px; }

            .admin-layout {
                height: calc(100vh - 160px);
                margin-top: 160px;
            }
            .admin-sidebar { max-height: 35vh; }
            .user-item { padding: 10px 12px; }
            .user-item .user-name { font-size: 13px; }
            .user-item .user-amount { font-size: 12px; }

            .admin-content { padding: 12px; }
            .detail-card {
                padding: 16px 14px;
                border-radius: 16px;
            }
            .detail-card .detail-row {
                font-size: 13px;
                padding: 6px 0;
            }
            .detail-card .detail-row .value.amount { font-size: 17px; }
            .detail-status-footer .status-item { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER (VERT ARRONDI)                                         -->
    <!-- ============================================================ -->
    <header class="admin-header">
        <div class="logo">
            <i class="fas fa-chart-bar"></i>
            Virtual <span>Market</span>
        </div>
        <div class="header-stats">
            <span class="stat-item visiteur">
                🟣 Visiteurs <span class="stat-value" id="statVisiteur">0</span>
            </span>
            <span class="stat-item participant">
                🟠 Participants <span class="stat-value" id="statParticipant">0</span>
            </span>
            <span class="stat-item donateur">
                🟢 Donateurs <span class="stat-value" id="statDonateur">0</span>
            </span>
            <span class="stat-item" style="background:rgba(255,255,255,0.15);">
                💰 Total <span class="stat-value" id="statTotal">0 FCFA</span>
            </span>
        </div>
        <div class="header-actions">
            <button class="btn-refresh" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> <span>Rafraîchir</span>
            </button>
            <a href="/virtmak.html" class="btn-home">
                <i class="fas fa-home"></i> <span>Accueil</span>
            </a>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- FILTRES                                                       -->
    <!-- ============================================================ -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">
            📋 Tous <span class="badge-count" id="countAll">0</span>
        </button>
        <button class="filter-btn" data-filter="visiteur">
            🟣 Visiteurs <span class="badge-count" id="countVisiteur">0</span>
        </button>
        <button class="filter-btn" data-filter="participant">
            🟠 Participants <span class="badge-count" id="countParticipant">0</span>
        </button>
        <button class="filter-btn" data-filter="donateur">
            🟢 Donateurs <span class="badge-count" id="countDonateur">0</span>
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- LAYOUT PRINCIPAL                                             -->
    <!-- ============================================================ -->
    <div class="admin-layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title"><i class="fas fa-users"></i> Utilisateurs</span>
                <span class="sidebar-count" id="sidebarCount">0</span>
            </div>

            <div class="users-list" id="usersList">
                <div class="empty-users" id="emptyUsers">
                    <i class="fas fa-inbox"></i>
                    <p>Aucun utilisateur</p>
                </div>
            </div>
        </aside>

        <!-- ===== CONTENU PRINCIPAL ===== -->
        <main class="admin-content" id="adminContent">
            <div class="empty-detail" id="emptyDetail">
                <i class="fas fa-hand-holding-heart"></i>
                <h3>Aucun utilisateur sélectionné</h3>
                <p>Cliquez sur un utilisateur dans la liste de gauche</p>
            </div>

            <div id="detailContainer" style="display:none;">
                <!-- Rempli par JS -->
            </div>
        </main>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ admin.html (filtres) chargé');

            // ===== RÉFÉRENCES =====
            const usersList = document.getElementById('usersList');
            const emptyUsers = document.getElementById('emptyUsers');
            const emptyDetail = document.getElementById('emptyDetail');
            const detailContainer = document.getElementById('detailContainer');
            const refreshBtn = document.getElementById('refreshBtn');

            const statVisiteur = document.getElementById('statVisiteur');
            const statParticipant = document.getElementById('statParticipant');
            const statDonateur = document.getElementById('statDonateur');
            const statTotal = document.getElementById('statTotal');

            const countAll = document.getElementById('countAll');
            const countVisiteur = document.getElementById('countVisiteur');
            const countParticipant = document.getElementById('countParticipant');
            const countDonateur = document.getElementById('countDonateur');

            const sidebarCount = document.getElementById('sidebarCount');
            const filterBtns = document.querySelectorAll('.filter-btn');

            let allUsers = [];
            let selectedId = null;
            let currentFilter = 'all';

            // ===== CHARGER LES DONNÉES =====
            async function loadData() {
                try {
                    const res = await fetch('/api/payments');
                    const data = await res.json();

                    if (data.success && data.payments) {
                        allUsers = data.payments;
                        renderStats();
                        renderFilters();
                        renderUsers();
                        // Sélectionner le premier si disponible
                        if (!selectedId && allUsers.length > 0) {
                            selectedId = allUsers[0].id;
                            renderDetail(selectedId);
                        } else if (selectedId) {
                            const exists = allUsers.some(u => u.id === selectedId);
                            if (!exists && allUsers.length > 0) {
                                selectedId = allUsers[0].id;
                                renderDetail(selectedId);
                            } else if (exists) {
                                renderDetail(selectedId);
                            }
                        }
                    } else {
                        allUsers = [];
                        renderStats();
                        renderFilters();
                        renderUsers();
                    }
                } catch (error) {
                    console.error('❌ Erreur chargement:', error);
                }
            }

            // ===== STATS =====
            function renderStats() {
                const visiteurs = allUsers.filter(u => u.user_status === 'visiteur' || u.flex5 === 'visiteur');
                const participants = allUsers.filter(u => u.user_status === 'participant' || u.flex5 === 'participant');
                const donateurs = allUsers.filter(u => u.user_status === 'donateur' || u.flex5 === 'donateur');

                const totalDonations = donateurs.reduce((sum, u) => sum + (u.amount || 0), 0) / 100;

                statVisiteur.textContent = visiteurs.length;
                statParticipant.textContent = participants.length;
                statDonateur.textContent = donateurs.length;
                statTotal.textContent = totalDonations.toLocaleString() + ' FCFA';
            }

            // ===== FILTRES =====
            function renderFilters() {
                const visiteurs = allUsers.filter(u => u.user_status === 'visiteur' || u.flex5 === 'visiteur');
                const participants = allUsers.filter(u => u.user_status === 'participant' || u.flex5 === 'participant');
                const donateurs = allUsers.filter(u => u.user_status === 'donateur' || u.flex5 === 'donateur');

                countAll.textContent = allUsers.length;
                countVisiteur.textContent = visiteurs.length;
                countParticipant.textContent = participants.length;
                countDonateur.textContent = donateurs.length;
            }

            // ===== AFFICHER LES UTILISATEURS =====
            function renderUsers() {
                let filtered = allUsers;

                if (currentFilter !== 'all') {
                    filtered = filtered.filter(u => {
                        const status = u.user_status || u.flex5 || 'visiteur';
                        return status === currentFilter;
                    });
                }

                // Trier par date (plus récent en premier)
                filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                sidebarCount.textContent = filtered.length;

                if (filtered.length === 0) {
                    usersList.innerHTML = `
                        <div class="empty-users">
                            <i class="fas fa-inbox"></i>
                            <p>Aucun utilisateur</p>
                        </div>
                    `;
                    return;
                }

                const statusColors = {
                    'visiteur': '#a78bfa',
                    'participant': '#fbbf24',
                    'donateur': '#34d399'
                };

                const statusIcons = {
                    'visiteur': '🟣',
                    'participant': '🟠',
                    'donateur': '🟢'
                };

                usersList.innerHTML = filtered.map(u => {
                    const status = u.user_status || u.flex5 || 'visiteur';
                    const name = u.flex1 || u.user_name || 'Anonyme';
                    const amount = (u.amount || 0) / 100;
                    const isActive = u.id === selectedId;
                    const initial = name.charAt(0).toUpperCase();

                    return `
                        <div class="user-item ${isActive ? 'active' : ''}" data-id="${u.id}">
                            <div class="user-name">
                                <span class="avatar" style="background:${statusColors[status]};">${initial}</span>
                                <span class="user-status-dot ${status}"></span>
                                ${name}
                            </div>
                            <div class="user-amount">${amount.toLocaleString()} FCFA</div>
                        </div>
                    `;
                }).join('');

                // Événements de clic
                document.querySelectorAll('.user-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        selectedId = id;
                        renderUsers();
                        renderDetail(id);
                    });
                });
            }

            // ===== AFFICHER LE DÉTAIL =====
            function renderDetail(id) {
                const user = allUsers.find(u => u.id === id);
                if (!user) {
                    emptyDetail.style.display = 'block';
                    detailContainer.style.display = 'none';
                    return;
                }

                emptyDetail.style.display = 'none';
                detailContainer.style.display = 'block';

                const status = user.user_status || user.flex5 || 'visiteur';
                const name = user.flex1 || user.user_name || 'Anonyme';
                const email = user.flex2 || user.user_email || 'Non renseigné';
                const amount = (user.amount || 0) / 100;
                const txId = user.transaction_id || '-';
                const createdAt = user.created_at ? new Date(user.created_at) : null;
                const executedAt = user.executed_at ? new Date(user.executed_at) : null;
                const updatedAt = user.updated_at ? new Date(user.updated_at) : null;

                const statusLabels = {
                    'visiteur': { label: '🟣 Visiteur', class: 'visiteur' },
                    'participant': { label: '🟠 Participant', class: 'participant' },
                    'donateur': { label: '🟢 Donateur', class: 'donateur' }
                };
                const statusInfo = statusLabels[status] || statusLabels.visiteur;

                // Formater les dates
                const formatDate = (date) => {
                    if (!date) return '-';
                    return date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                };

                // Déterminer les statuts avec horaires
                const hasPayment = status === 'donateur' && executedAt;
                const hasLink = status === 'participant' || status === 'donateur';

                detailContainer.innerHTML = `
                    <div class="detail-card">
                        <div class="detail-header">
                            <span class="detail-title"><i class="fas fa-user"></i> Détail utilisateur</span>
                            <span class="detail-id">#${user.id}</span>
                        </div>

                        <div class="detail-row">
                            <span class="label">👤 Nom</span>
                            <span class="value">${name}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">📧 Email</span>
                            <span class="value">${email}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">💰 Montant</span>
                            <span class="value amount">${amount.toLocaleString()} FCFA</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">📊 Statut</span>
                            <span class="value"><span class="status-badge ${statusInfo.class}">${statusInfo.label}</span></span>
                        </div>
                        <div class="detail-row">
                            <span class="label">🔗 Transaction</span>
                            <span class="value tx-id">${txId}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">📅 Date de soutien</span>
                            <span class="value">${formatDate(createdAt)}</span>
                        </div>
                        ${hasLink ? `
                            <div class="detail-row">
                                <span class="label">🔗 Lien généré</span>
                                <span class="value">${formatDate(updatedAt)}</span>
                            </div>
                        ` : ''}
                        ${hasPayment ? `
                            <div class="detail-row">
                                <span class="label">✅ Date de paiement</span>
                                <span class="value">${formatDate(executedAt)}</span>
                            </div>
                        ` : ''}

                        <!-- ===== STATUT AVEC HORAIRES ===== -->
                        <div class="detail-status-footer">
                            ${status === 'visiteur' ? `
                                <div class="status-item">
                                    <span class="status-label"><i class="fas fa-clock" style="color:#a78bfa;"></i> En attente</span>
                                    <span class="status-time pending">
                                        ${formatDate(createdAt)}
                                        <span class="badge pending">⏳ En attente</span>
                                    </span>
                                </div>
                            ` : ''}
                            ${status === 'participant' ? `
                                <div class="status-item">
                                    <span class="status-label"><i class="fas fa-link" style="color:#fbbf24;"></i> Lien généré</span>
                                    <span class="status-time pending">
                                        ${formatDate(updatedAt)}
                                        <span class="badge pending">⏳ En attente</span>
                                    </span>
                                </div>
                            ` : ''}
                            ${status === 'donateur' ? `
                                <div class="status-item">
                                    <span class="status-label"><i class="fas fa-check-circle" style="color:#22c55e;"></i> Paiement réussi</span>
                                    <span class="status-time success">
                                        ${formatDate(executedAt)}
                                        <span class="badge success">✅ Succès</span>
                                    </span>
                                </div>
                                ${hasLink ? `
                                    <div class="status-item" style="border-top:1px solid #f0f2f5;padding-top:6px;margin-top:2px;">
                                        <span class="status-label"><i class="fas fa-link" style="color:#6b7280;"></i> Lien généré</span>
                                        <span class="status-time" style="color:#6b7280;">
                                            ${formatDate(updatedAt)}
                                        </span>
                                    </div>
                                ` : ''}
                            ` : ''}
                        </div>

                        <div style="margin-top:16px;padding-top:12px;border-top:2px solid #f0f2f5;display:flex;gap:10px;flex-wrap:wrap;">
                            <button class="copy-btn" data-copy="${txId}" style="background:#f8f9fc;border:1px solid #e6e8ef;border-radius:30px;padding:6px 16px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;">
                                <i class="fas fa-copy"></i> Copier l'ID
                            </button>
                            <button class="copy-btn" data-copy="${name}" style="background:#f8f9fc;border:1px solid #e6e8ef;border-radius:30px;padding:6px 16px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;">
                                <i class="fas fa-copy"></i> Copier le nom
                            </button>
                        </div>
                    </div>
                `;

                // Événements copie
                document.querySelectorAll('.detail-card .copy-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const text = this.dataset.copy;
                        navigator.clipboard.writeText(text).then(() => {
                            this.style.background = '#e6f7ee';
                            this.style.color = '#0F8B5D';
                            this.innerHTML = '<i class="fas fa-check"></i> Copié !';
                            setTimeout(() => {
                                this.style.background = '#f8f9fc';
                                this.style.color = '#6b7280';
                                this.innerHTML = '<i class="fas fa-copy"></i> ' + (this.textContent.includes('ID') ? "Copier l'ID" : 'Copier le nom');
                            }, 2000);
                        }).catch(() => {
                            const input = document.createElement('input');
                            input.value = text;
                            document.body.appendChild(input);
                            input.select();
                            document.execCommand('copy');
                            document.body.removeChild(input);
                            this.style.background = '#e6f7ee';
                            this.style.color = '#0F8B5D';
                            this.innerHTML = '<i class="fas fa-check"></i> Copié !';
                            setTimeout(() => {
                                this.style.background = '#f8f9fc';
                                this.style.color = '#6b7280';
                                this.innerHTML = '<i class="fas fa-copy"></i> ' + (this.textContent.includes('ID') ? "Copier l'ID" : 'Copier le nom');
                            }, 2000);
                        });
                    });
                });
            }

            // ===== FILTRES =====
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderUsers();
                    // Sélectionner le premier utilisateur du filtre
                    const firstUser = document.querySelector('.user-item');
                    if (firstUser) {
                        const id = parseInt(firstUser.dataset.id);
                        selectedId = id;
                        renderUsers();
                        renderDetail(id);
                    } else {
                        selectedId = null;
                        emptyDetail.style.display = 'block';
                        detailContainer.style.display = 'none';
                    }
                });
            });

            // ===== RAFRAÎCHIR =====
            refreshBtn.addEventListener('click', function() {
                loadData();
            });

            // ===== AUTO-REFRESH =====
            setInterval(loadData, 30000);

            // ===== INIT =====
            loadData();

            console.log('✅ admin.html initialisé');

        });
    </script>

</body>
</html>
