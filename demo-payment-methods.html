<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo - Méthodes de paiement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(21, 111, 230, 0.06);
        }

        .container .title {
            font-size: 20px;
            font-weight: 700;
            color: #0F1B4D;
            text-align: center;
            margin-bottom: 4px;
        }

        .container .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 24px;
        }

        .methods-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .method-card {
            padding: 16px 12px;
            border: 2px solid #e6e8ef;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fc;
        }

        .method-card:hover {
            border-color: #156FE6;
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .method-card.selected {
            border-color: #156FE6;
            background: #eaf1ff;
            box-shadow: 0 2px 12px rgba(21, 111, 230, 0.08);
        }

        .method-card .logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 6px auto;
        }

        .method-card .name {
            font-size: 13px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .method-card .sub {
            font-size: 11px;
            color: #9ca3af;
        }

        .method-card .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }

        .method-card .badge.recommended {
            background: #e6f7ee;
            color: #0e7a49;
        }

        .method-card .badge.popular {
            background: #fef3c7;
            color: #b45309;
        }

        /* Couleurs par méthode */
        .method-card.wave { border-color: #156FE6; }
        .method-card.wave.selected { border-color: #156FE6; background: #eaf1ff; }

        .method-card.orange { border-color: #FF6600; }
        .method-card.orange.selected { border-color: #FF6600; background: #fff0e6; }

        .method-card.mtn { border-color: #FFCC00; }
        .method-card.mtn.selected { border-color: #FFCC00; background: #fffce6; }

        .method-card.moov { border-color: #0066CC; }
        .method-card.moov.selected { border-color: #0066CC; background: #e6f0ff; }

        .btn-confirm {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #156FE6, #0F1B4D);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(21, 111, 230, 0.3);
        }

        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #f0f7ff;
            border: 1px solid #c7d9fb;
            font-size: 13px;
            color: #0F1B4D;
            display: none;
            text-align: center;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result .highlight {
            font-weight: 700;
            color: #156FE6;
        }

        .result .code-block {
            margin-top: 8px;
            padding: 8px 12px;
            background: #1a1a2e;
            color: #4ade80;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            text-align: left;
            word-break: break-all;
        }

        @media (max-width: 420px) {
            .container { padding: 24px 16px; }
            .methods-grid { gap: 8px; }
            .method-card { padding: 12px 8px; }
            .method-card .logo-img { height: 28px; }
            .method-card .name { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">💳 Choisissez votre méthode</div>
        <div class="subtitle">Sélectionnez votre moyen de paiement préféré</div>

        <div class="methods-grid" id="methodsGrid">
            <!-- Wave -->
            <div class="method-card wave" data-method="wave">
                <img src="/wave.png" alt="Wave" class="logo-img" />
                <div class="name">Wave</div>
                <div class="sub">Paiement mobile</div>
                <span class="badge recommended">Recommandé</span>
            </div>

            <!-- Orange Money -->
            <div class="method-card orange" data-method="orange_money">
                <img src="/om.png" alt="Orange Money" class="logo-img" />
                <div class="name">Orange Money</div>
                <div class="sub">Paiement mobile</div>
                <span class="badge popular">Populaire</span>
            </div>

            <!-- MTN MoMo -->
            <div class="method-card mtn" data-method="mtn_momo">
                <img src="/mtn.png" alt="MTN MoMo" class="logo-img" />
                <div class="name">MTN MoMo</div>
                <div class="sub">Paiement mobile</div>
            </div>

            <!-- Moov Money -->
            <div class="method-card moov" data-method="moov_money">
                <img src="/moov.png" alt="Moov Money" class="logo-img" />
                <div class="name">Moov Money</div>
                <div class="sub">Paiement mobile</div>
            </div>
        </div>

        <button class="btn-confirm" id="confirmBtn" disabled>
            <span>Confirmer et continuer</span>
        </button>

        <div class="result" id="result">
            ✅ Méthode sélectionnée : <span class="highlight" id="selectedMethod">-</span>
            <div class="code-block" id="codeBlock">paymentMethod: 'wave'</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ demo-payment-methods.html chargé');

            const cards = document.querySelectorAll('.method-card');
            const confirmBtn = document.getElementById('confirmBtn');
            const result = document.getElementById('result');
            const selectedMethodSpan = document.getElementById('selectedMethod');
            const codeBlock = document.getElementById('codeBlock');

            let selectedMethod = null;

            const methodNames = {
                'wave': 'Wave',
                'orange_money': 'Orange Money',
                'mtn_momo': 'MTN MoMo',
                'moov_money': 'Moov Money'
            };

            // Sélection d'une méthode
            cards.forEach(card => {
                card.addEventListener('click', function() {
                    cards.forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedMethod = this.dataset.method;
                    confirmBtn.disabled = false;
                    console.log('✅ Méthode sélectionnée:', selectedMethod);
                });
            });

            // Confirmation
            confirmBtn.addEventListener('click', function() {
                if (!selectedMethod) return;

                const name = methodNames[selectedMethod] || selectedMethod;
                selectedMethodSpan.textContent = name;
                codeBlock.textContent = `paymentMethod: '${selectedMethod}'`;
                result.classList.add('show');

                console.log('🔵 Confirmation:', {
                    method: selectedMethod,
                    name: name,
                    code: `paymentMethod: '${selectedMethod}'`
                });

                confirmBtn.textContent = '✅ Méthode enregistrée';
                confirmBtn.disabled = true;
            });

            console.log('✅ demo-payment-methods.html initialisé');

        });
    </script>

</body>
</html>
