<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Merci - VirtMak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px 32px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(21, 111, 230, 0.06);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card .icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .card h1 {
            font-size: 28px;
            font-weight: 800;
            color: #156FE6;
            margin-bottom: 4px;
        }

        .card .sub {
            font-size: 16px;
            color: #0F1B4D;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card .message {
            font-size: 14px;
            color: #1a1a2e;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .card .message .highlight {
            color: #156FE6;
            font-weight: 700;
        }

        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #156FE6, #0F1B4D);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-home:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(21, 111, 230, 0.3);
        }

        @media (max-width: 500px) {
            .card { padding: 32px 20px 24px 20px; }
            .card h1 { font-size: 24px; }
            .card .icon { font-size: 48px; }
            .btn-home { font-size: 14px; padding: 12px 32px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">❤️</div>
        <h1>MERCI !</h1>
        <div class="sub">Votre paiement a été confirmé</div>
        <div class="message">
            Nous vous remercions sincèrement pour votre soutien.
            <br>
            <span class="highlight">VirtMak</span> grandit grâce à vous.
        </div>
        <a href="/virtmak.html" class="btn-home">
            🏠 Retour à l'accueil
        </a>
    </div>

</body>
</html>
