<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* ============================================================ */
        /* HEADER - 60px, arrondi 50px                                  */
        /* ============================================================ */
        .vm-header {
            background: #0F8B5D;
            height: 60px;
            border-radius: 50px;
            margin: 12px 16px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(15, 139, 93, 0.15);
            flex-shrink: 0;
        }

        .vm-header .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .vm-header .header-left i {
            font-size: 18px;
            opacity: 0.8;
        }

        .vm-header .header-left .slash {
            font-weight: 300;
            opacity: 0.5;
        }

        .vm-header .header-right {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ============================================================ */
        /* MAIN - Pas de bordure                                        */
        /* ============================================================ */
        .vm-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px 30px 16px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ============================================================ */
        /* TITRE - Vert                                                 */
        /* ============================================================ */
        .vm-title {
            text-align: center;
            margin: 4px 0 20px 0;
        }

        .vm-title h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0F8B5D;
            letter-spacing: -0.3px;
        }

        .vm-title .sub-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 2px;
        }

        /* ============================================================ */
        /* CARTE BLANCHE                                               */
        /* ============================================================ */
        .vm-card {
            background: white;
            border-radius: 24px;
            padding: 28px 24px 24px 24px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(15, 139, 93, 0.06);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================ */
        /* FORMULAIRE                                                   */
        /* ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .form-group label i {
            color: #0F8B5D;
            margin-right: 6px;
            width: 18px;
        }

        .form-group .input-wrapper {
            display: flex;
            align-items: center;
            background: #f8f9fc;
            border: 2px solid #e6e8ef;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #0F8B5D;
            box-shadow: 0 0 0 4px rgba(15, 139, 93, 0.08);
            background: white;
        }

        .form-group .input-wrapper input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            background: transparent;
            outline: none;
            color: #1a1a2e;
            font-weight: 500;
            min-width: 0;
        }

        .form-group .input-wrapper input::placeholder {
            color: #b0b5c4;
            font-weight: 400;
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 16px 0 4px;
            color: #b0b5c4;
            font-size: 18px;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: #0F8B5D;
        }

        .form-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
            padding-left: 4px;
        }

        /* ============================================================ */
        /* MONTANT AVEC BOUTON MODIFIER                                 */
        /* ============================================================ */
        .amount-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .amount-wrapper .input-wrapper {
            flex: 1;
            min-width: 0;
        }

        .amount-wrapper .btn-edit {
            background: #f8f9fc;
            border: 2px solid #e6e8ef;
            border-radius: 14px;
            padding: 0 14px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 44px;
        }

        .amount-wrapper .btn-edit:hover {
            border-color: #0F8B5D;
            color: #0F8B5D;
            background: #f0faf5;
        }

        .amount-wrapper .btn-edit.active {
            border-color: #0F8B5D;
            background: #e6f7ee;
            color: #0F8B5D;
        }

        /* ============================================================ */
        /* MONTANTS SUGGÉRÉS                                            */
        /* ============================================================ */
        .suggested-amounts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .suggested-amounts .suggest-btn {
            flex: 1;
            min-width: 50px;
            padding: 8px 4px;
            border: 2px solid #e6e8ef;
            border-radius: 12px;
            background: #f8f9fc;
            font-size: 13px;
            font-weight: 600;
            color: #3a4152;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .suggested-amounts .suggest-btn:hover {
            border-color: #0F8B5D;
            background: #e8f5ec;
            color: #0F8B5D;
            transform: translateY(-2px);
        }

        .suggested-amounts .suggest-btn.active {
            border-color: #0F8B5D;
            background: #0F8B5D;
            color: white;
        }

        .suggested-amounts .suggest-btn.default {
            border-color: #0F8B5D;
            background: #e6f7ee;
            color: #0F8B5D;
        }

        /* ============================================================ */
        /* BOUTON SOUMISSION                                            */
        /* ============================================================ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0F8B5D, #0A6B47);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 35px rgba(15, 139, 93, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit i {
            font-size: 18px;
        }

        /* ============================================================ */
        /* MESSAGE INFO                                                 */
        /* ============================================================ */
        .info-message {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            background: #eaf1ff;
            color: #2563eb;
            border: 1px solid #c7d9fb;
            display: none;
        }

        .info-message.show {
            display: block;
        }

        .info-message.warning {
            background: #fff3df;
            color: #b45309;
            border-color: #f5dbaa;
        }

        /* ============================================================ */
        /* FOOTER SECURITE                                              */
        /* ============================================================ */
        .vm-footer-security {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 16px;
            opacity: 0.7;
        }

        .vm-footer-security i {
            color: #0F8B5D;
            margin-right: 4px;
        }

        /* ============================================================ */
        /* TOAST                                                         */
        /* ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: #0F8B5D;
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            display: none;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast-container.error {
            background: #dc3545;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================ */
        /* RESPONSIVE                                                    */
        /* ============================================================ */
        @media (max-width: 600px) {
            .vm-header {
                height: 54px;
                border-radius: 40px;
                margin: 10px 12px 0 12px;
                padding: 0 16px;
            }
            .vm-header .header-left {
                font-size: 17px;
            }
            .vm-header .header-left i {
                font-size: 15px;
            }
            .vm-header .header-right {
                font-size: 10px;
                padding: 3px 10px;
            }
            .vm-main {
                padding: 16px 12px 20px 12px;
            }
            .vm-title h2 {
                font-size: 19px;
            }
            .vm-title .sub-icon {
                font-size: 24px;
            }
            .vm-card {
                padding: 22px 18px 18px 18px;
                border-radius: 20px;
            }
            .form-group .input-wrapper input {
                font-size: 15px;
                padding: 12px 14px;
            }
            .btn-submit {
                font-size: 16px;
                padding: 14px;
            }
            .amount-wrapper .btn-edit {
                height: 48px;
                font-size: 12px;
                padding: 0 12px;
                min-width: 38px;
            }
            .suggested-amounts .suggest-btn {
                font-size: 12px;
                padding: 6px 4px;
                min-width: 44px;
            }
            .suggested-amounts {
                gap: 6px;
            }
        }

        @media (max-width: 420px) {
            .vm-header {
                height: 48px;
                border-radius: 32px;
                margin: 8px 8px 0 8px;
                padding: 0 12px;
            }
            .vm-header .header-left {
                font-size: 14px;
            }
            .vm-header .header-left i {
                font-size: 12px;
            }
            .vm-header .header-right {
                font-size: 9px;
                padding: 2px 8px;
            }
            .vm-main {
                padding: 12px 8px 16px 8px;
            }
            .vm-title h2 {
                font-size: 17px;
            }
            .vm-title .sub-icon {
                font-size: 20px;
            }
            .vm-card {
                padding: 18px 14px 14px 14px;
                border-radius: 18px;
            }
            .form-group {
                margin-bottom: 12px;
            }
            .form-group label {
                font-size: 13px;
            }
            .form-group .input-wrapper input {
                font-size: 14px;
                padding: 10px 12px;
            }
            .btn-submit {
                font-size: 14px;
                padding: 12px;
                border-radius: 14px;
            }
            .amount-wrapper .btn-edit {
                height: 42px;
                font-size: 11px;
                padding: 0 10px;
                min-width: 34px;
                border-radius: 12px;
            }
            .suggested-amounts .suggest-btn {
                font-size: 11px;
                padding: 5px 4px;
                min-width: 38px;
                border-radius: 10px;
            }
            .suggested-amounts {
                gap: 4px;
            }
            .form-hint {
                font-size: 11px;
            }
            .vm-footer-security {
                font-size: 11px;
                margin-top: 12px;
            }
            .toast-container {
                font-size: 13px;
                padding: 10px 16px;
                bottom: 16px;
            }
        }

        @media (max-width: 350px) {
            .vm-header .header-left {
                font-size: 12px;
            }
            .vm-title h2 {
                font-size: 15px;
            }
            .vm-card {
                padding: 14px 10px 12px 10px;
                border-radius: 16px;
            }
            .amount-wrapper {
                gap: 6px;
            }
            .suggested-amounts .suggest-btn {
                font-size: 10px;
                padding: 4px 2px;
                min-width: 32px;
            }
            .btn-submit {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER - 60px, arrondi 50px, avec BETA                       -->
    <!-- ============================================================ -->
    <header class="vm-header">
        <div class="header-left">
            <i class="fas fa-code"></i>
            <span class="slash">/</span>
            VirtMak
        </div>
        <span class="header-right">BETA</span>
    </header>

    <!-- ============================================================ -->
    <!-- CONTENU PRINCIPAL                                             -->
    <!-- ============================================================ -->
    <main class="vm-main">

        <!-- Titre -->
        <div class="vm-title">
            <span class="sub-icon">🌿</span>
            <h2>Votre prochaine place e-commerce</h2>
        </div>

        <!-- Carte blanche -->
        <div class="vm-card">

            <form id="virtmakForm">

                <!-- Nom -->
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Votre nom</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="nameInput" placeholder="Entrez votre nom" required autocomplete="name" />
                    </div>
                    <div class="form-hint">Nous vous remercierons personnellement</div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Votre email</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="emailInput" placeholder="exemple@email.com" required autocomplete="email" />
                    </div>
                    <div class="form-hint">Nous vous enverrons un remerciement</div>
                </div>

                <!-- Montant -->
                <div class="form-group">
                    <label><i class="fas fa-heart"></i> Montant (FCFA)</label>
                    <div class="amount-wrapper">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-money-bill-wave"></i></span>
                            <input type="number" id="amountInput" placeholder="150 minimum" min="150" value="150" required />
                        </div>
                        <button type="button" class="btn-edit" id="editBtn">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>

                    <!-- Montants suggérés -->
                    <div class="suggested-amounts">
                        <button type="button" class="suggest-btn default" data-amount="150">150</button>
                        <button type="button" class="suggest-btn" data-amount="500">500</button>
                        <button type="button" class="suggest-btn" data-amount="1000">1K</button>
                        <button type="button" class="suggest-btn" data-amount="2500">2.5K</button>
                    </div>
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-rocket"></i> Soutenir le projet
                </button>

                <div id="infoMessage" class="info-message"></div>
            </form>

            <!-- Sécurité -->
            <div class="vm-footer-security">
                <i class="fas fa-lock"></i> Paiement sécurisé via Jèko
            </div>

        </div>

    </main>

    <!-- ============================================================ -->
    <!-- TOAST                                                         -->
    <!-- ============================================================ -->
    <div class="toast-container" id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ virtmak.html (redesign) chargé');

            // ===== RÉFÉRENCES =====
            const form = document.getElementById('virtmakForm');
            const nameInput = document.getElementById('nameInput');
            const emailInput = document.getElementById('emailInput');
            const amountInput = document.getElementById('amountInput');
            const editBtn = document.getElementById('editBtn');
            const submitBtn = document.getElementById('submitBtn');
            const infoMessage = document.getElementById('infoMessage');
            const toast = document.getElementById('toast');
            const suggestBtns = document.querySelectorAll('.suggest-btn');

            let isAmountEditable = false;

            // ===== TOAST =====
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.className = 'toast-container' + (type === 'error' ? ' error' : '');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 4000);
            }

            // ===== MESSAGE INFO =====
            function showInfo(message, type = 'info') {
                infoMessage.textContent = message;
                infoMessage.className = 'info-message show' + (type === 'warning' ? ' warning' : '');
                setTimeout(() => {
                    infoMessage.className = 'info-message';
                }, 4000);
            }

            // ===== MONTANTS PRÉ-REMPLIS =====
            suggestBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const amount = parseInt(this.dataset.amount);
                    amountInput.value = amount;
                    suggestBtns.forEach(b => b.classList.remove('active', 'default'));
                    this.classList.add('active');
                    isAmountEditable = false;
                    editBtn.classList.remove('active');
                    editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                    amountInput.disabled = true;
                    validateForm();
                });
            });

            // ===== BOUTON MODIFIER =====
            editBtn.addEventListener('click', function() {
                isAmountEditable = !isAmountEditable;
                this.classList.toggle('active');
                amountInput.disabled = !isAmountEditable;
                this.innerHTML = isAmountEditable ?
                    '<i class="fas fa-check"></i>' :
                    '<i class="fas fa-pen"></i>';

                if (isAmountEditable) {
                    amountInput.focus();
                    amountInput.select();
                    suggestBtns.forEach(b => b.classList.remove('active', 'default'));
                } else {
                    const val = parseInt(amountInput.value);
                    if (val < 150) {
                        amountInput.value = 150;
                        showInfo('⚠️ Le montant minimum est de 150 FCFA.', 'warning');
                    }
                }
                validateForm();
            });

            // ===== VALIDATION =====
            function validateForm() {
                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const amount = parseInt(amountInput.value);

                let isValid = true;
                if (name.length < 2) isValid = false;
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) isValid = false;
                if (isNaN(amount) || amount < 150) isValid = false;

                submitBtn.disabled = !isValid;
                return isValid;
            }

            nameInput.addEventListener('input', validateForm);
            emailInput.addEventListener('input', validateForm);
            amountInput.addEventListener('input', validateForm);

            // ===== SOUMISSION =====
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const amount = parseInt(amountInput.value);

                if (!validateForm()) {
                    showInfo('⚠️ Veuillez remplir tous les champs correctement.', 'warning');
                    return;
                }

                if (amount < 150) {
                    showInfo('⚠️ Le montant minimum est de 150 FCFA.', 'warning');
                    return;
                }

                console.log('📝 Formulaire soumis');
                console.log('👤 Nom:', name);
                console.log('📧 Email:', email);
                console.log('💰 Montant:', amount);

                // ✅ Redirection vers pay.html
                const url = `/pay.html?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&amount=${amount}`;
                console.log('🔗 Redirection vers:', url);

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirection...';

                setTimeout(() => {
                    window.location.href = url;
                }, 600);
            });

            // ===== INIT =====
            amountInput.disabled = true;
            validateForm();
            console.log('✅ virtmak.html (redesign) initialisé');

        });
    </script>

</body>
</html>
