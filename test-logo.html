<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Logo VirtMak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f9;
            min-height: 100vh;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #0F1B4D;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e6e8ef;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card .label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            margin-top: 12px;
        }

        .card .label .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .badge-blue {
            background: #156FE6;
            color: white;
        }

        .badge-green {
            background: #0F8B5D;
            color: white;
        }

        .badge-ring {
            background: #0F1B4D;
            color: white;
        }

        /* ============================================================ */
        /* FORMATS DU LOGO - NOUVELLE CHARTE BLEUE                     */
        /* ============================================================ */

        /* ---- Anneau (favori) ---- */
        .logo-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: white;
            border: 5px solid #156FE6;
            padding: 8px;
            box-shadow: 0 0 0 2px rgba(21, 111, 230, 0.1);
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 50%;
        }

        /* ---- Carré avec bordure bleue ---- */
        .logo-square {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            margin: 0 auto;
            background: white;
            border: 3px solid #156FE6;
        }

        .logo-square img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---- Cercle avec fond bleu ---- */
        .logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: #156FE6;
            padding: 10px;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: brightness(0) invert(1);
        }

        /* ---- Triangle ---- */
        .logo-triangle {
            width: 100px;
            height: 100px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            overflow: hidden;
            margin: 0 auto;
            background: white;
        }

        .logo-triangle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---- Hexagone ---- */
        .logo-hexagon {
            width: 100px;
            height: 100px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            overflow: hidden;
            margin: 0 auto;
            background: white;
        }

        .logo-hexagon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---- Rond avec ombre bleue ---- */
        .logo-shadow {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: white;
            box-shadow: 0 8px 30px rgba(21, 111, 230, 0.25);
            border: 2px solid rgba(21, 111, 230, 0.1);
        }

        .logo-shadow img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---- Badge bleu (fond bleu, logo blanc) ---- */
        .logo-badge {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: linear-gradient(135deg, #156FE6, #0F1B4D);
            padding: 14px;
            border: 3px solid #156FE6;
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: brightness(0) invert(1);
        }

        /* ---- Format Hero ---- */
        .logo-hero {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: white;
            border: 6px solid #156FE6;
            padding: 12px;
            box-shadow: 0 8px 40px rgba(21, 111, 230, 0.15);
        }

        .logo-hero img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 50%;
        }

        /* ---- Favicon ---- */
        .logo-favicon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto;
            background: #156FE6;
            padding: 4px;
        }

        .logo-favicon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: brightness(0) invert(1);
        }

        .logo-favicon-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .logo-favicon-row .logo-favicon {
            margin: 0;
        }

        /* ---- Plein (sans bordure) ---- */
        .logo-plain {
            width: 100px;
            height: 100px;
            overflow: hidden;
            margin: 0 auto;
        }

        .logo-plain img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---- Anneau avec fond bleu (version alternative) ---- */
        .logo-ring-alt {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            background: #156FE6;
            border: 4px solid white;
            padding: 8px;
            box-shadow: 0 0 0 3px #156FE6;
        }

        .logo-ring-alt img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 50%;
            filter: brightness(0) invert(1);
        }

        /* ============================================================ */
        /* RESPONSIVE                                                    */
        /* ============================================================ */
        @media (max-width: 600px) {
            h1 { font-size: 22px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .card { padding: 20px 14px; }
            .logo-square, .logo-circle, .logo-triangle, .logo-ring,
            .logo-hexagon, .logo-plain, .logo-shadow, .logo-badge,
            .logo-ring-alt {
                width: 80px;
                height: 80px;
            }
            .logo-hero { width: 120px; height: 120px; }
        }

        @media (max-width: 420px) {
            .grid { gap: 12px; }
            .card { padding: 16px 10px; }
            .logo-square, .logo-circle, .logo-triangle, .logo-ring,
            .logo-hexagon, .logo-plain, .logo-shadow, .logo-badge,
            .logo-ring-alt {
                width: 65px;
                height: 65px;
            }
            .logo-hero { width: 100px; height: 100px; }
            .card .label { font-size: 11px; }
        }
    </style>
</head>
<body>

    <h1>🎨 Test Logo VirtMak</h1>
    <p class="subtitle">
        Nouvelle charte <strong style="color:#156FE6;">Bleu roi #156FE6</strong> —
        <span style="background:#156FE6;color:white;padding:2px 12px;border-radius:12px;font-size:12px;">Préférence : Anneau</span>
    </p>

    <div class="grid">

        <!-- 1. Anneau (⭐ FAVORI) -->
        <div class="card" style="border:2px solid #156FE6;background:#f0f7ff;">
            <div class="logo-ring">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">
                ⭐ Anneau
                <span class="badge badge-blue">FAVORI</span>
            </div>
        </div>

        <!-- 2. Carré -->
        <div class="card">
            <div class="logo-square">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">📐 Carré</div>
        </div>

        <!-- 3. Cercle (fond bleu) -->
        <div class="card">
            <div class="logo-circle">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">⭕ Cercle bleu</div>
        </div>

        <!-- 4. Triangle -->
        <div class="card">
            <div class="logo-triangle">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">🔺 Triangle</div>
        </div>

        <!-- 5. Hexagone -->
        <div class="card">
            <div class="logo-hexagon">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">⬡ Hexagone</div>
        </div>

        <!-- 6. Ombre bleue -->
        <div class="card">
            <div class="logo-shadow">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">🌓 Ombre bleue</div>
        </div>

        <!-- 7. Badge (bleu → marine) -->
        <div class="card">
            <div class="logo-badge">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">🏅 Badge</div>
        </div>

        <!-- 8. Anneau alternatif -->
        <div class="card">
            <div class="logo-ring-alt">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">💍 Anneau inversé</div>
        </div>

        <!-- 9. Hero -->
        <div class="card" style="grid-column: span 1;">
            <div class="logo-hero">
                <img src="/logo.png" alt="Logo VirtMak" />
            </div>
            <div class="label">🖼️ Hero</div>
        </div>

        <!-- 10. Favicon -->
        <div class="card" style="grid-column: span 1;">
            <div class="logo-favicon-row">
                <div class="logo-favicon">
                    <img src="/logo.png" alt="Logo VirtMak" />
                </div>
                <div class="logo-favicon">
                    <img src="/logo.png" alt="Logo VirtMak" />
                </div>
                <div class="logo-favicon">
                    <img src="/logo.png" alt="Logo VirtMak" />
                </div>
            </div>
            <div class="label">📌 Favicon</div>
        </div>

    </div>

    <div style="text-align:center;margin-top:40px;color:#9ca3af;font-size:13px;">
        <i class="fas fa-check-circle" style="color:#156FE6;"></i>
        Logo testé avec la nouvelle charte <strong style="color:#156FE6;">Bleu roi #156FE6</strong>
        —
        <span style="background:#156FE6;color:white;padding:1px 10px;border-radius:12px;font-size:11px;">Anneau ⭐</span>
    </div>

</body>
